<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects by Onur Demircan, a game developer.">
    <title data-i18n="nav_projects">My Projects</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header>
        <nav class="nav-buttons">
            <a href="index.html"><button class="nav-btn" data-i18n="nav_home">Home</button></a>
            <a href="about.html"><button class="nav-btn" data-i18n="nav_about">About Me</button></a>
            <a href="projects.html" class="active"><button class="nav-btn" data-i18n="nav_projects">My Projects</button></a>
        </nav>
        <div class="lang-selector">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="tr">TR</button>
        </div>
    </header>

    <main>
        <section class="content-section" style="max-width: 1000px;">
            <div class="projects-header">
                <h1 class="title" data-i18n="proj_title">Projects</h1>
                <div class="filter-controls">
                    <label for="sort-order" class="filter-text" data-i18n="proj_filter">Filter:</label>
                    <select id="sort-order">
                        <option value="earliest" data-i18n="proj_oldest">Oldest</option>
                        <option value="latest" data-i18n="proj_newest" selected>Newest</option>
                    </select>
                </div>
            </div>

            <div id="projects-container" class="projects-grid">
                <!-- Projects will be injected here by projects.js -->
            </div>
        </section>
    </main>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/projects.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
