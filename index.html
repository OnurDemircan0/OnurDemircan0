<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Onur Demircan, a game developer and the founder of Gravity Vortex.">
    <title data-i18n="nav_home">Home</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header>
        <nav class="nav-buttons">
            <a href="index.html" class="active"><button class="nav-btn" data-i18n="nav_home">Home</button></a>
            <a href="about.html"><button class="nav-btn" data-i18n="nav_about">About Me</button></a>
            <a href="projects.html"><button class="nav-btn" data-i18n="nav_projects">My Projects</button></a>
        </nav>
        <div class="lang-selector">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="tr">TR</button>
        </div>
    </header>

    <main>
        <section class="content-section">
            <div class="profile-container">
                <img src="assets/images/profile_photo.jpg" alt="Onur Demircan" class="profile-img">
            </div>

            <article>
                <h1 class="center-sentence title" data-i18n="welcome">Welcome!</h1>
                <p class="center-sentence paragraph" data-i18n="intro1">I'm Onur Demircan.</p>
                <p class="center-sentence paragraph" data-i18n="intro2">I am a game developer and the founder of Gravity Vortex.</p>
            </article>
            
            <section class="contact-section">
                <h2 data-i18n="contact_title">Contact</h2>
                <form id="contactForm">
                    <label for="name" data-i18n="label_name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="email" data-i18n="label_email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="message" data-i18n="label_message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                    
                    <button type="submit" data-i18n="btn_send">Send</button>
                </form>
            </section>
        </section>
    </main>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
