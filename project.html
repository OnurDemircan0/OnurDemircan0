<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header>
        <nav class="nav-buttons">
            <a href="index.html#home" class="nav-link"><button class="nav-btn" data-i18n="nav_home">Home</button></a>
            <a href="index.html#about" class="nav-link"><button class="nav-btn" data-i18n="nav_about">About Me</button></a>
            <a href="index.html#projects" class="nav-link"><button class="nav-btn" data-i18n="nav_projects">My Projects</button></a>
            <a href="index.html#contact" class="nav-link"><button class="nav-btn" data-i18n="nav_contact">Contact</button></a>
        </nav>
        <div class="lang-selector">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="tr">TR</button>
        </div>
    </header>

    <main>
        <section class="content-section project-detail-section">
            <div class="project-header">
                <a href="index.html#projects" class="back-btn" data-i18n="btn_back">← Back to Projects</a>
            </div>    
            
            <div id="project-detail-container" style="display: none; margin-top: 2rem;">
                <h1 id="proj-title" class="title"></h1>
                
                <div class="project-layout">
                    <!-- Image Gallery / Carousel -->
                    <div class="project-gallery">
                        <div class="main-img-wrapper main-image-container" style="border-radius: 15px; overflow: hidden; min-height: 200px;">
                            <img id="main-gallery-img" src="" alt="Project Image" class="image-fade" onload="this.classList.add('loaded')">
                            <div class="gallery-controls" id="gallery-controls" style="display: none;">
                                <button id="prev-img" class="gallery-btn">❮</button>
                                <button id="next-img" class="gallery-btn">❯</button>
                            </div>
                        </div>
                        <div id="gallery-thumbnails" class="gallery-thumbnails"></div>
                    </div>

                    <!-- Details -->
                    <div class="project-content">
                        <p id="proj-desc" class="paragraph" style="margin-bottom: 2rem;"></p>
                        
                        <div class="project-actions" style="display: flex; gap: 1rem; align-items: center; margin-top: 1rem; flex-wrap: wrap;">
                              <a id="play-store-link" href="#" target="_blank" class="store-badge-link" style="transition: transform 0.2s ease;">
                                  <img src="assets/images/GetItOnGooglePlay_Badge_Web_color_English.svg" alt="Get it on Google Play" style="height: 45px;">
                              </a>
                              <a id="app-store-link" href="#" target="_blank" class="store-badge-link" style="display: none; transition: transform 0.2s ease;">
                                  <img src="assets/images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg" alt="Download on the App Store" style="height: 45px;">
                              </a>
                              <a id="privacy-link" href="#" target="_blank" class="cta-btn secondary-btn" style="height: 45px; display: inline-flex; align-items: center; padding: 0 1.5rem; margin-top: 0;">
                                  <span data-i18n="btn_privacy">Privacy Policy</span>
                              </a>
                          </div>
                    </div>
                </div>
            </div>
            
            <div id="error-container" style="display: none; text-align: center; margin-top: 3rem;">
                <h2 data-i18n="error_not_found">Project not found.</h2>
            </div>
        </section>
    </main>
    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox-modal" style="display: none;">
        <span class="lightbox-close">&times;</span>
        <button id="lightbox-prev" class="lightbox-btn">❮</button>
        <img class="lightbox-content" id="lightbox-img" alt="Zoomed Image">
        <button id="lightbox-next" class="lightbox-btn">❯</button>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/project-detail.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
